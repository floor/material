name: Menu close-contract evidence from main

on:
  pull_request:
    paths:
      - .github/workflows/menu-close-contract-evidence.yml
      - scripts/menu-close-contract-evidence.ts
      - scripts/menu-close-contract-stall.ts
      - scripts/menu-close-contract-browser-evidence.ts
      - scripts/fixtures/menu-close-contract-evidence.ts

permissions:
  contents: read

jobs:
  repeated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stall: 0
            rounds: 500
          - stall: 40
            rounds: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Repeat the unchanged check in fresh processes
        env:
          CLOSE_CONTRACT_STALL_MS: ${{ matrix.stall }}
          CLOSE_CONTRACT_ROUNDS: ${{ matrix.rounds }}
        run: bun scripts/menu-close-contract-evidence.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: close-contract-${{ matrix.stall }}
          path: analysis/menu-close-contract-${{ matrix.stall }}
          retention-days: 7

  browser-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - name: Observe the reveal and dismissal in a standalone document
        run: bun scripts/menu-close-contract-browser-evidence.ts
