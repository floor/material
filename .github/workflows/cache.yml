# Fills the caches that CI restores: bun's packages, Playwright's browsers and the
# system packages they need (.github/actions/browsers).
#
# A pull request can restore a cache saved on its own ref, on its base branch or
# on the default branch, and nothing else. CI runs on pull requests only, so
# without this every cache was saved on a pull request's ref, where no other pull
# request could read it: the first run of each one started cold. Saving them on
# main and next lets every pull request start warm.
#
# This runs no check and gates nothing. When the caches are current it restores
# them and stops, in well under a minute.
name: Cache

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browser sets of CI's browser groups.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browsers: ["chromium"]
    name: browsers (${{ matrix.browsers }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browsers }}
