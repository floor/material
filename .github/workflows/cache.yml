# Fills the caches that CI restores: bun's packages, Playwright's browsers and the
# system packages they need (.github/actions/browsers).
#
# A pull request can restore a cache saved on its own ref, on its base branch or
# on the default branch, and nothing else. CI runs on pull requests only, so
# without this every cache was saved on a pull request's ref, where no other pull
# request could read it: the first run of each one started cold. Saving them on
# main and next lets every pull request start warm.
#
# The keys hold the runner image version, which changes about weekly, and GitHub
# drops a cache nobody read for seven days. The daily run refills them without
# waiting for a merge: a scheduled run is on the default branch, whose caches
# every pull request can read.
#
# This runs no check and gates nothing. When the caches are current it restores
# them and stops, in well under a minute.
name: Cache

on:
  push:
    branches: [main, next]
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two browser sets as CI's browser groups.
  browsers:
    runs-on: ubuntu-24.04
    # Long enough for the slowest mirror seen (42 minutes for both installs): a
    # job that times out saves nothing, and this one gates nothing.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browsers: ["chromium", "chromium firefox webkit"]
    name: browsers (${{ matrix.browsers }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browsers }}
