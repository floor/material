name: Publish

on:
  push:
    tags:
      - 'v1.*.*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: This branch publishes 1.x only
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            1.*) ;;
            *)
              echo "This branch publishes 1.x only, but package.json version is $VERSION. 3.x is published from the default branch." >&2
              exit 1
              ;;
          esac

      - run: npm publish --tag legacy
