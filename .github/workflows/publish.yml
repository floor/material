# Publishes material to npm when a version tag is pushed, with npm trusted
# publishing: the workflow's identity is what npm trusts (configured on
# npmjs.com for the package), no token is stored, and the release carries
# provenance. A pre-release version (x.y.z-next.N) goes under the `next`
# dist-tag, anything else under `latest`.
#
# Two jobs do the publishing, so the OIDC token exists in as few steps as
# possible: `verify` runs
# the checks, the build, the published-manifest step and `npm pack`, and uploads
# the tarball; `publish` alone holds `id-token: write` and downloads the tarball,
# re-checks its version and publishes it — no checkout, no install, no build.
# A third job, `dist-tags`, re-reads the registry after the publish and fails if
# `next` was left behind `latest` or the version just published; nothing needs
# it, so its failure is loud but blocks neither the publish nor the GitHub
# Release.
# The tag's commit must be on main and the version must be package.json's; a
# tag ruleset protecting v* (only the owner creates them) is recommended.
# The step "A material release is 3.0.0 or later" refuses a `material` version
# below 3: this same file is the `material` repository's release workflow, and
# npm's trusted publisher cannot tell the two lines apart (it knows the
# repository and this file's name, not the branch).
# Never push this repository's version tags to floor/material: a pushed v* tag
# starts a publish there.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Everything that runs this repository's code, with no OIDC token around to
  # leak: the checks, the build, and the pack.
  verify:
    runs-on: ubuntu-24.04
    steps:
      # The actions are pinned by commit; the version comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tagged commit is checked against origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"

      - name: The tag must be the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      # Only a commit on main is releaseable: a tag on an unmerged branch must not publish.
      - name: The tagged commit must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }

      - name: A material release is 3.0.0 or later
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$name" = "material" ]; then
            case "$version" in
              [3-9].*|[1-9][0-9]*.*) ;;
              *)
                echo "$name $version: a material release is 3.0.0 or later; the 1.x line is published from the v1 branch" >&2
                exit 1
                ;;
            esac
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      # npm packs from the repository root, so the manifest it packs is the root
      # package.json: drop what only the repository uses. prepublishOnly goes with the
      # scripts, which is why the build runs as its own step above.
      # The README it packs is the root README.md too: npm's page gets the short one,
      # npm-readme.md, written over it in this job's checkout only (nothing is
      # committed, and no package script rewrites a working tree).
      # scripts/package-fixture.ts runs this step's commands, read from this file by
      # the step's name, on a copy of the tree for every packed check, and size:check
      # asserts the result: each pull request proves which manifest and README ship.
      - name: The published manifest and README
        run: |
          npm pkg delete scripts eslintConfig typedocOptions
          cp npm-readme.md README.md

      # Packed once, here, with the npm the Node 22 above ships; this exact file
      # is what publish uploads and npm gets.
      - name: Pack the tarball
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: material-*.tgz
          if-no-files-found: error

  # Only the token, a Node with the pinned npm, and the tarball verify built.
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; pinned, bump on purpose.
      - run: npm install -g npm@11.21.0

      - name: Publish the tarball
        run: |
          tgz="$(ls material-*.tgz)"
          tag="${GITHUB_REF_NAME#v}"
          version="$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$tag" != "$version" ]; then
            echo "the tarball holds $version, not v$tag" >&2
            exit 1
          fi
          case "$version" in
            *-*) dist=next ;;
            *) dist=latest ;;
          esac
          npm publish "$tgz" --provenance --access public --tag "$dist"

      # A stable publish moves `latest` only, so `next` is left where it was:
      # `npm install material@next` would install an older build than `material`.
      # This step points `next` at the version just published when it sorts
      # below it, through npm's trusted publishing — the same OIDC identity, no
      # token and no terminal (npm 11.21.0 or later, pinned above). It needs the
      # one-time "Allow npm dist-tag" setting on the package's trusted publisher
      # on npmjs.com; while that is off npm refuses the move.
      # The comparison is semver's precedence, not npm's range matching: a range
      # with no prerelease comparator on the same major.minor.patch excludes
      # prereleases, so `npm view '@<3.3.1'` never lists 3.3.1-next.1 and a
      # behind prerelease stayed put. It is written out here because the publish
      # job runs with no checkout, so there is no repo script to call.
      # The publish above has already happened and cannot be rolled back, so
      # nothing in this step may fail the job: every outcome — a refused move,
      # an unreadable registry — is reported in the run summary and as a
      # warning annotation, and the step exits 0. The `dist-tags` job below
      # reports the same state loudly, on its own.
      - name: Move the next dist-tag after a stable publish
        run: |
          set +e
          tgz="$(ls material-*.tgz)"
          name="$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          version="$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          report() {
            echo "::warning title=next dist-tag::$1"
            { echo "### next dist-tag"; echo; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"
            echo "$1"
          }
          case "$version" in
            *-*)
              echo "Prerelease $name@$version: it went to next; there is nothing to move."
              exit 0
              ;;
          esac
          if ! tags="$(curl -fsS --retry 3 "https://registry.npmjs.org/-/package/$name/dist-tags")"; then
            report "The registry's dist-tags for $name could not be read, so next was not checked. The publish itself succeeded: a maintainer checks the next tag on npmjs.com."
            exit 0
          fi
          next="$(printf '%s' "$tags" | node -e 'const tags = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(typeof tags.next === "string" ? tags.next : "")')"
          if [ -z "$next" ]; then
            echo "$name has no next dist-tag: nothing to move."
            exit 0
          fi
          # Semver precedence (https://semver.org/#spec-item-11): build metadata
          # is ignored, a prerelease sorts below its release, a numeric
          # identifier below an alphanumeric one. Exit 0 when next sorts below
          # version, 1 when it does not, 2 when either is not a version.
          status=0
          NEXT="$next" VERSION="$version" node -e '
            const parse = (text) => {
              const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(text);
              if (!match) return null;
              return { core: [Number(match[1]), Number(match[2]), Number(match[3])], pre: match[4] ? match[4].split(".") : [] };
            };
            const compare = (left, right) => {
              for (let i = 0; i < 3; i += 1) {
                if (left.core[i] !== right.core[i]) return left.core[i] < right.core[i] ? -1 : 1;
              }
              if (left.pre.length === 0) return right.pre.length === 0 ? 0 : 1;
              if (right.pre.length === 0) return -1;
              for (let i = 0; i < Math.min(left.pre.length, right.pre.length); i += 1) {
                const a = left.pre[i];
                const b = right.pre[i];
                const numeric = /^\d+$/;
                if (numeric.test(a) && numeric.test(b)) {
                  if (Number(a) !== Number(b)) return Number(a) < Number(b) ? -1 : 1;
                } else if (numeric.test(a)) {
                  return -1;
                } else if (numeric.test(b)) {
                  return 1;
                } else if (a !== b) {
                  return a < b ? -1 : 1;
                }
              }
              if (left.pre.length === right.pre.length) return 0;
              return left.pre.length < right.pre.length ? -1 : 1;
            };
            const next = parse(process.env.NEXT);
            const version = parse(process.env.VERSION);
            if (!next || !version) process.exit(2);
            process.exit(compare(next, version) < 0 ? 0 : 1);
          ' || status=$?
          if [ "$status" -eq 2 ]; then
            report "$name's next tag ($next) or the published version ($version) is not a version, so next was not moved. The publish itself succeeded: a maintainer checks the next tag on npmjs.com."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "$name@$next does not sort below $version: next stays where it is."
            exit 0
          fi
          if npm dist-tag add "$name@$version" next; then
            { echo "### next dist-tag"; echo; echo "Moved next from $next to $version."; } >> "$GITHUB_STEP_SUMMARY"
            echo "next now points at $version."
          else
            report "npm refused to move the next dist-tag from $next to $version, so npm install $name@next still installs $next. The publish itself succeeded and nothing after it depends on this. The package's trusted publisher on npmjs.com likely lacks the one-time \"Allow npm dist-tag\" setting; once an owner enables it, the next stable release moves the tag itself. A maintainer can move it now with npm dist-tag add $name@$version next --auth-type=web."
          fi
          exit 0

  # The state a publish left, checked loudly but blocking nothing: once npm has
  # the version, `next` must not sort below `latest` (a stable release whose
  # old `next` tag stays behind would leave `material@next` older than
  # `material`). The version just published is passed in, so the check compares
  # `next` against the higher of `latest` and it: right after a publish the
  # registry can still answer with the previous `latest`, and against that a
  # stale `next` would pass on the first read. Its own job, needing only
  # `publish`, so a failure fails this job alone — it can neither block the
  # publish (already done) nor skip the GitHub Release (which needs `publish`,
  # not this). The check re-reads the registry with a bounded retry, because
  # the registry can still answer with the previous tags right after a publish;
  # it never changes which tag was chosen.
  dist-tags:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: The next dist-tag must not be behind the published version
        run: bun run check:dist-tags "${GITHUB_REF_NAME#v}"

  # The GitHub Release for the tag, once npm has the version: its CHANGELOG.md
  # section and a footer (scripts/release-notes.ts). A pre-release is marked one
  # and never becomes Latest. Run again on the same tag, it finds the release and
  # stops. Only this job writes to the repository, with the workflow's own token.
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The release $tag exists; nothing to do."
            exit 0
          fi
          bun scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          case "$version" in
            *-*) flags="--prerelease --latest=false" ;;
            *) flags="--latest" ;;
          esac
          gh release create "$tag" --title "material $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $flags
