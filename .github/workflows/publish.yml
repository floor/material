# Publishes material to npm when a version tag is pushed, with npm trusted
# publishing: the workflow's identity is what npm trusts (configured on
# npmjs.com for the package), no token is stored, and the release carries
# provenance. A pre-release version (x.y.z-next.N) goes under the `next`
# dist-tag, anything else under `latest`.
# The step "A material release is 3.0.0 or later" refuses a `material` version
# below 3: this same file is the `material` repository's release workflow, and
# npm's trusted publisher cannot tell the two lines apart (it knows the
# repository and this file's name, not the branch).
# Never push this repository's version tags to floor/material: a pushed v* tag
# starts a publish there.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: The tag must be the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: A material release is 3.0.0 or later
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$name" = "material" ]; then
            case "$version" in
              [3-9].*|[1-9][0-9]*.*) ;;
              *)
                echo "$name $version: a material release is 3.0.0 or later; the 1.x line is published from the v1 branch" >&2
                exit 1
                ;;
            esac
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      # npm publishes from the repository root, so the manifest it packs is the root
      # package.json: drop what only the repository uses. prepublishOnly goes with the
      # scripts, which is why the build runs as its own step above.
      # The README it packs is the root README.md too: npm's page gets the short one,
      # npm-readme.md, written over it in this job's checkout only (nothing is
      # committed, and no package script rewrites a working tree).
      # scripts/package-fixture.ts runs this step's commands, read from this file by
      # the step's name, on a copy of the tree for every packed check, and size:check
      # asserts the result: each pull request proves which manifest and README ship.
      - name: The published manifest and README
        run: |
          npm pkg delete scripts eslintConfig typedocOptions
          cp npm-readme.md README.md

      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"

  # The GitHub Release for the tag, once npm has the version: its CHANGELOG.md
  # section and a footer (scripts/release-notes.ts). A pre-release is marked one
  # and never becomes Latest. Run again on the same tag, it finds the release and
  # stops. Only this job writes to the repository, with the workflow's own token.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The release $tag exists; nothing to do."
            exit 0
          fi
          bun scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          case "$version" in
            *-*) flags="--prerelease --latest=false" ;;
            *) flags="--latest" ;;
          esac
          gh release create "$tag" --title "material $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $flags
