# Runs on every pull request, on every push to main, nightly on main, and on
# demand. Without it a version tag publishes whatever is on that commit having run
# nothing: `prepublishOnly` builds, so a broken build fails the release, but the
# tests were never run in CI.
#
# The work is split into parallel jobs, so a run takes as long as its slowest job
# rather than the sum of every step. `check` waits for all of them and is the one
# status the main ruleset requires, so the jobs can change without touching it.
#
# A push to main runs the same checks on the merge commit itself, so the commit a
# tag publishes carries a green run of its own instead of relying on the pull
# request's. The nightly run on main stays as the safety net.
#
# Benchmarks are excluded by default (test/benchmarks/bench.ts): they compare
# elapsed time to fixed thresholds and fail on a busy runner, which would make
# this red for reasons that are not about the code.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces. A run on main
# is never cancelled: each merge commit keeps a verdict of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Types, the strictness ratchets, lint and test-file naming, run side by side.
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Types, ratchets, lint, test naming, test types, internal ids and public names (in parallel)
        # The step's shell stops at the first failing command (bash -e), in the
        # background shells too. `|| status=$?` keeps a failing script from ending
        # its shell before the status is written: without it a failure printed
        # none of the output below, only "exit code 1".
        run: |
          logs=$(mktemp -d)
          pids=()
          for script in ts:check lint test:naming test:types ids:check public-names:check; do
            (status=0; bun run "$script" > "$logs/$script.log" 2>&1 || status=$?; echo "$status" > "$logs/$script.status") &
            pids+=($!)
          done
          wait "${pids[@]}" || true
          failed=0
          for script in ts:check lint test:naming test:types ids:check public-names:check; do
            status=$(cat "$logs/$script.status" 2> /dev/null || echo "not recorded")
            echo "::group::$script (exit $status)"
            cat "$logs/$script.log" || true
            echo "::endgroup::"
            [ "$status" = 0 ] || { echo "::error::$script failed"; failed=1; }
          done
          exit $failed
      - name: Changelog fragment
        # A change under src/ carries one .changes/ fragment, and only a
        # release branch edits CHANGELOG.md; the assembler consumes fragments
        # in the release pull request. The script reads pull requests only: a
        # push's diff cannot name the branch the changes were reviewed on.
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$CHANGELOG_BASE" ]; then git fetch --quiet --depth=1 origin "$CHANGELOG_BASE"; fi
          bun run changelog:check
      - name: Package name
        run: bun run name:check

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test/build/export-pin-removals.test.ts compares the export pins with the latest release tag
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test

  # The build alone, so the jobs that read dist/ start as soon as it exists.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # The checks that read the built package, on the build's dist/.
  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Every dist JS module is reachable from the package exports
        run: bun run dist-modules:check
      - name: Every dist JS file parses at the package's ES2022 syntax floor
        run: bun run syntax:check
      - name: Typography role defaults and opt-in fallbacks remain unchanged
        run: bun run typescale-defaults:check
      - name: Element CSS files and exports
        run: bun run elements-css:check
      - name: Build and consumer tooling types
        run: bun run tooling:check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      # Runs after Node is pinned: this check also packs the tarball and reads
      # it the way a consumer does.
      - name: Token catalogue is fresh, deterministic, packed and schema-valid
        env:
          MTRL_CATALOGUE_COMMIT: ${{ github.sha }}
        run: bun run tokens:catalogue:check
      - name: Component classes match the stylesheets
        run: bun run classes:check
      - name: SSR adapter entries are minified
        run: bun run ssr-comments:check
      - name: Packed SSR on Node and Bun, and browser isolation
        run: bun run ssr-consumer:check
      - name: Packed imports and size budgets
        run: bun run size:check
      - name: Public Sass entries compile from the packed package
        run: bun run styles-package:check
      - name: README examples, specifiers, sizes and links against the packed package
        run: bun run readme:check
      - name: The third-party notice is packed, and names the glyphs it covers
        run: bun run notice:check
      - name: Documented imports, in every doc and JSDoc example, against the packed package
        run: bun run docs-imports:check
      - name: Packed declarations carry their deprecation notes and hover documentation
        run: bun run declaration-docs:check
      - name: Every packed declaration entry resolves to declarations a consumer can name and compile
        run: bun run declaration-exports:check
      - name: Per-component gzip budgets
        run: bun run size
      - name: One adapter component ships only its element
        run: bun run adapters:size

  # The browser checks, in groups that run side by side, on the build's dist/.
  # A run takes as long as its slowest group, so a check that grows moves to a
  # group of its own rather than making one group longer. Every check is in
  # exactly one group; test/build/ci-commands.test.ts holds the list.
  # The `:floor` commands run a check again on the lowest peer version that
  # package.json allows, and put the installed version back before they return
  # (scripts/check-at-peer-floor.ts), so their place in a group does not matter.
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      # Playwright 1.63.0 Noble (linux/amd64). Update this digest with bun.lock.
      image: ${{ (contains(matrix.browsers, 'firefox') || contains(matrix.browsers, 'webkit')) && 'mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7' || '' }}
      options: --ipc=host
    env:
      PLAYWRIGHT_CONTAINER: ${{ (contains(matrix.browsers, 'firefox') || contains(matrix.browsers, 'webkit')) && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: elements-a
            browsers: chromium
            checks: elements:check:a
          - group: elements-b
            browsers: chromium
            checks: elements:check:b
          - group: shadow-styles
            browsers: chromium
            checks: shadow-styles:check
          - group: adapters
            browsers: chromium
            checks: react:check react-ssr:check vue:check svelte:check svelte-ssr:check vue-ssr:check solid-ssr:check solid:check solid-ssr:floor vue-ssr:floor react-types:check vue-types:check solid-types:check svelte-types:check react-types:floor vue-types:floor solid-types:floor svelte-types:floor
          - group: components-a
            browsers: chromium
            checks: core:check carousel:check a11y-svg:check
          - group: components-b
            browsers: chromium
            checks: consumer:check tabs:check slider:check tooltip:check tooltip-menu:check drawer:check navigation-bar:check navigation-rail:check toolbar-card:check split-button:check select:check datepicker-deferred:check readme-browser:check rtl:check progress:check dialog-afteropen:check dialog-reduced-motion:check switch-transition:check
          - group: menu-deferred
            browsers: chromium
            checks: menu-deferred:check
          - group: menu-item-checked
            browsers: chromium
            checks: menu-item-checked:check
          - group: fab-menu-ripple
            browsers: chromium
            checks: fab-menu-ripple:check
          - group: fab-menu-position
            browsers: chromium
            checks: fab-menu-position:check
          - group: fab-menu-items
            browsers: chromium
            checks: fab-menu-items:check
          - group: app-bar-conformance
            browsers: chromium
            checks: app-bar-conformance:check top-app-bar:check
          - group: closed-surfaces
            browsers: chromium
            checks: closed-surfaces:check
          - group: divider-sheet-conformance
            browsers: chromium
            checks: divider-sheet-conformance:check
          - group: bottom-app-bar-toolbar
            browsers: chromium
            checks: bottom-app-bar-toolbar:check
          - group: button-profile
            browsers: chromium
            checks: button-profile:check
          - group: listbox
            browsers: chromium firefox webkit
            checks: listbox:check
          - group: styles
            browsers: chromium
            checks: preupgrade:check tokens:check tokens:catalogue-browser:check contrast-emit:check theme-root-scope:check theme-runtime:check theme-origins:check spring-tokens:check base-lite:check base-elements:check typescale-consumers:check component-sheets:check density:check
          - group: ssr-a
            browsers: chromium
            checks: ssr:check:a
          - group: ssr-b
            browsers: firefox webkit
            checks: ssr:check:b
    name: browser (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ env.PLAYWRIGHT_CONTAINER != 'true' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.PLAYWRIGHT_CONTAINER != 'true'
        with:
          bun-version: "1.4.2"
      - name: Install pinned Bun in the Playwright container
        if: env.PLAYWRIGHT_CONTAINER == 'true'
        # The image has npm but lacks unzip, which setup-bun needs.
        run: |
          npm install --prefix "$RUNNER_TEMP/material-bun" --no-save --no-package-lock --no-audit --no-fund @oven/bun-linux-x64@1.4.2
          install "$RUNNER_TEMP/material-bun/node_modules/@oven/bun-linux-x64/bin/bun" /usr/local/bin/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLAYWRIGHT_CONTAINER != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - uses: ./.github/actions/browsers
        if: env.PLAYWRIGHT_CONTAINER != 'true'
        with:
          browsers: ${{ matrix.browsers }}
      - name: Check Playwright container version
        if: env.PLAYWRIGHT_CONTAINER == 'true'
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const { driverVersion } = JSON.parse(readFileSync(process.env.PLAYWRIGHT_BROWSERS_PATH + '/.docker-info', 'utf8'))
          const { version } = require('./node_modules/playwright/package.json')
          if (driverVersion !== version) {
            console.error(`Playwright container is ${driverVersion}, but bun.lock installs ${version}. Update the Noble image digest in ci.yml.`)
            process.exit(1)
          }
          console.log(`Playwright container and package both use ${version}`)
          NODE
      - name: Stage checks for the container home directory owner
        if: env.PLAYWRIGHT_CONTAINER == 'true'
        shell: bash
        # Firefox refuses to run as root with GitHub's mounted /github/home
        # owned by the runner user. Stage a writable checkout as that user.
        run: |
          owner=$(stat -c %u /github/home)
          group=$(stat -c %g /github/home)
          as_owner=(setpriv --reuid "$owner" --regid "$group" --clear-groups)
          staged=$("${as_owner[@]}" mktemp -d /github/home/material-browser.XXXXXX)
          tar -cf - . | "${as_owner[@]}" tar -xf - -C "$staged"
          printf 'BROWSER_CHECKOUT=%s\n' "$staged" >> "$GITHUB_ENV"
      # The prototype's invariants are relative to the revision this run
      # changes: a pull request's base, or the parent a push lands on. The
      # nightly run has neither, so it falls back to the checked-out commit and
      # tests that revision against itself.
      - name: Base revision for the opt-in bar prototype
        if: matrix.group == 'bottom-app-bar-toolbar'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          path: .prototype-baseline
          persist-credentials: false
      - name: Build the baseline fixture independently
        if: matrix.group == 'bottom-app-bar-toolbar'
        working-directory: .prototype-baseline
        # Fixture setup uses its own pinned lock and sources. Cross-run dist
        # artifacts expire after a day; this proof must keep working afterwards.
        run: |
          bun install --frozen-lockfile
          bun run scripts/build.ts
      - name: Checks (${{ matrix.checks }})
        # A check that hangs must fail on its own, and name itself. On
        # 2026-11-03 this step held the adapters job for 30 minutes until the
        # run was cancelled, and the job's log was not retained afterwards, so
        # the sub-check that hung could not be read. The deadline ends a hang
        # within about eight minutes, and each sub-check logs its start and its
        # end, so the last line before a timeout names the one that hung. No
        # retry: a hang stays a failure.
        timeout-minutes: 8
        shell: bash
        env:
          # The prototype check derives its receipt from the revision this run
          # changes, the same one the baseline step checks out.
          PROTOTYPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          runner=(bun)
          if [ "$PLAYWRIGHT_CONTAINER" = true ]; then
            cd "$BROWSER_CHECKOUT"
            runner=(setpriv --reuid "$(stat -c %u /github/home)" --regid "$(stat -c %g /github/home)" --clear-groups bun)
          fi
          for script in ${{ matrix.checks }}; do
            start=$SECONDS
            echo "::group::$script (start)"
            "${runner[@]}" run "$script" || { echo "::endgroup::"; echo "::error::$script failed"; exit 1; }
            echo "::endgroup::"
            echo "$script: passed in $((SECONDS - start))s"
          done
      - name: Collect container browser artifacts
        if: always() && env.BROWSER_CHECKOUT != ''
        run: |
          if [ -d "$BROWSER_CHECKOUT/analysis" ]; then
            mkdir -p analysis
            cp -R "$BROWSER_CHECKOUT/analysis/." analysis/
          fi
      - name: Browser comparison artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-comparisons-${{ matrix.group }}
          path: |
            analysis/browser
            analysis/slider-dom
            analysis/drawer
            analysis/navigation-rail
            analysis/core
            analysis/listbox
            analysis/catalogue-full.json
            analysis/token-catalogue-evidence.json
            analysis/ssr-parity-chromium.json
            analysis/ssr-upgrade
            analysis/react-ssr/summary.json
            analysis/svelte-ssr/summary.json
            analysis/vue-ssr/summary.json
            analysis/solid-ssr/summary.json
            analysis/solid-ssr/async-*.json
          retention-days: 7
          if-no-files-found: ignore

  # The identity gate of the token catalogue: a data-only change may not move a
  # single byte of the default surface. The step no-ops itself when no
  # catalogue input changed (the scope test is inside the step, not an `if`, so
  # the gate can never be silently skipped by the workflow). On a pull request
  # the checkout is the merge commit, so the base it compares against is the
  # main tip that merge was computed from: bytes main itself moved since the
  # branch started are not this change's to answer for, and the comparison sees
  # exactly this pull request's delta. On a main push HEAD is that tip, the
  # scope test is empty, and the step rests.
  identity:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - name: Catalogue identity, when a catalogue input changed
        run: |
          base="$(git rev-parse origin/main)"
          changed="$(git diff --name-only "$base" HEAD -- scripts/token-catalogue scripts/generate-token-catalogue.ts scripts/check-token-catalogue.ts scripts/check-token-catalogue-browser.ts scripts/check-catalogue-identity.ts scripts/style-manifest.ts scripts/optional-style-profiles.ts scripts/button-style-profile.ts)"
          if [ -z "$changed" ]; then
            echo "no catalogue input changed against main $base; the identity gate does not apply"
            exit 0
          fi
          # A component that retains another at runtime must name that sheet.
          # That dependency edge is not catalogue data. Any other edit of this
          # file, or any other catalogue input, still proves the surface.
          if [ "$changed" = "scripts/style-manifest.ts" ] && bun scripts/catalogue-scope.ts "$base"; then
            echo "style-manifest.ts changed only dependency edges against main $base; the identity gate does not apply"
            exit 0
          fi
          echo "catalogue inputs changed against main $base; proving existing-member identity and validated additions"
          npm pack --silent
          git worktree add ../material-base "$base"
          cd ../material-base
          bun install --frozen-lockfile
          bun run build
          npm pack --silent
          cd "$GITHUB_WORKSPACE"
          bun run catalogue:identity:check

  # Tooling-only comparators. Dependencies and builds never enter the published package.
  comparators:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adapter: [material-factories, material-elements, material-web, m3e, beercss, micl]
    name: comparator (${{ matrix.adapter }})
    env:
      COMPARATOR_ADAPTER: ${{ matrix.adapter }}
      COMPARATOR_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - name: Install locked comparator tooling (CI only)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/fixtures/comparators
          scripts/fixtures/comparators/node_modules/.bin/playwright install --with-deps chromium
      - name: Rendered fixture and per-asset comparison
        timeout-minutes: 10
        run: bun run comparators:check
      - name: Comparator evidence (including failed setup)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparators-${{ matrix.adapter }}
          path: |
            analysis/comparators
            scripts/fixtures/comparators/package-lock.json
          retention-days: 7
          if-no-files-found: error

  # Real workerd execution of the packed SSR entry and bridge imports, without
  # nodejs_compat. Its separately locked tooling never enters the npm package.
  ssr-worker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SSR_WORKER_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - name: Install locked worker tooling and framework peers (CI only)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/fixtures/ssr-worker
      - name: Packed worker rendering and native-global rollback
        run: bun run ssr-worker:check
      - name: Worker runtime and resolver evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssr-worker
          path: |
            analysis/ssr-worker
            scripts/fixtures/ssr-worker/package-lock.json
          retention-days: 7
          if-no-files-found: error

  # The status the main ruleset requires: green only when every job above is.
  check:
    if: always()
    needs: [static, tests, build, package, browser, identity, comparators, ssr-worker]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: |
          echo 'static=${{ needs.static.result }} tests=${{ needs.tests.result }} build=${{ needs.build.result }} package=${{ needs.package.result }} browser=${{ needs.browser.result }} identity=${{ needs.identity.result }} comparators=${{ needs.comparators.result }} ssr-worker=${{ needs.ssr-worker.result }}'
          [ '${{ needs.static.result }}' = success ] && [ '${{ needs.tests.result }}' = success ] \
            && [ '${{ needs.build.result }}' = success ] && [ '${{ needs.package.result }}' = success ] \
            && [ '${{ needs.browser.result }}' = success ] \
            && [ '${{ needs.identity.result }}' = success ] \
            && [ '${{ needs.comparators.result }}' = success ] \
            && [ '${{ needs.ssr-worker.result }}' = success ]
