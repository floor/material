# Playwright's browsers and the system packages they need, from the cache.
#
# `playwright install --with-deps` runs apt-get on every job, even when the
# browsers themselves are cached, and a slow Ubuntu mirror then decides how long
# CI takes: 26 minutes for one step on 2026-10-01, at 59 kB/s. So the packages
# apt downloads are cached as well, and installed from the files with dpkg, which
# has no mirror to reach for. The package set is the one `--with-deps` chose;
# nothing is left out, and `install-deps --dry-run` checks that on every cached
# install.
#
# On a miss, install dependencies before the browser binaries. Test jobs get
# two bounded attempts so a slow mirror cannot consume their whole deadline.
# The cache warmer has a longer deadline and saves the .deb files immediately,
# even if a later browser download or test fails.
#
# Needs node_modules (for Playwright's CLI) and Node on the PATH.
name: Playwright browsers
description: Install Playwright browsers and their system packages, cached.

inputs:
  browsers:
    description: Playwright browser names, separated by spaces.
    required: true
  deps-timeout:
    description: Maximum time for the first system dependency install attempt (GNU timeout duration).
    default: "4m"
  deps-retry-timeout:
    description: Maximum time for retrying system dependencies on the Ubuntu HTTPS archive (GNU timeout duration).
    default: "4m"

runs:
  using: composite
  steps:
    - name: Cache keys
      id: keys
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        version=$(node -p "require('./node_modules/playwright/package.json').version")
        set="$version-${BROWSERS// /-}"
        echo "browsers=playwright-${{ runner.os }}-$set" >> "$GITHUB_OUTPUT"
        # The packages depend on what the image already holds, so on its version too.
        echo "packages=playwright-packages-${ImageOS:-unknown}-${ImageVersion:-unknown}-$set" >> "$GITHUB_OUTPUT"

    - name: Browser cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.browsers }}

    - name: Restore system package cache
      id: packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-packages
        key: ${{ steps.keys.outputs.packages }}

    - name: Install system dependencies
      id: deps
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        CACHED: ${{ steps.packages.outputs.cache-hit }}
        DEPS_TIMEOUT: ${{ inputs.deps-timeout }}
        DEPS_RETRY_TIMEOUT: ${{ inputs.deps-retry-timeout }}
      run: bash "$GITHUB_ACTION_PATH/install-deps.sh"

    - name: Save system package cache
      if: steps.packages.outputs.cache-hit != 'true' && steps.deps.outputs.archives == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-packages
        key: ${{ steps.keys.outputs.packages }}

    - name: Install ${{ inputs.browsers }} binaries
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a browsers <<< "$BROWSERS"
        node node_modules/playwright/cli.js install "${browsers[@]}"
