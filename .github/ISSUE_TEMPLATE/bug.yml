name: Bug report
description: Broken behaviour — something does not work as documented, or a page built with it breaks.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for broken behaviour: something does not work as documented, or a page that uses
        the library breaks. A difference from the Material 3 specification or from Jetpack Compose is
        a conformance drift, not a bug — please use the conformance-drift form for it.

        Thanks for the report. The shortest path to a fix is a reproduction we can open.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: The component the page uses.
      options:
        - badge
        - bottom-app-bar
        - bottom-sheet
        - button
        - button-group
        - card
        - carousel
        - checkbox
        - chips
        - datepicker
        - dialog
        - divider
        - extended-fab
        - fab
        - fab-menu
        - icon-button
        - list
        - loading-indicator
        - menu
        - navigation-bar
        - navigation-drawer
        - navigation-rail
        - progress
        - radios
        - search
        - select
        - side-sheet
        - slider
        - snackbar
        - split-button
        - switch
        - tabs
        - text-field
        - timepicker
        - toolbar
        - tooltip
        - top-app-bar
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The installed version, from the `material` entry in `npm ls` or your lockfile.
      placeholder: 3.16.7
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser and its version, and the operating system.
      placeholder: Chrome 153 on macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
      placeholder: |
        1. Open the page
        2. Press Tab twice
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and where that comes from (the documentation, or a Material 3 page you read).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead, with any measurement you have.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A code block that mounts the component alone, or a link to a page that shows the defect.
      render: html
    validations:
      required: true
