<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>fab-menu</title>
<link rel="stylesheet" href="/dist/styles.css">
<link rel="stylesheet" href="/shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "/shared/harness.js";
import { createFabMenu } from "/dist/components/fab-menu/index.js";
await initPage({ name: "fab-menu", toolbar: { density: true } });
const main = document.getElementById("tp-main");

const placements = ["top-start", "top-end", "top-centre", "bottom-start", "bottom-end", "bottom-centre"];
const items = Array.from({ length: 12 }, (_, i) => ({ id: `i${i}`, text: `Item ${i + 1}` }));
const mount = (body, placement, longList) => {
  const box = document.createElement("div");
  box.style.cssText = "position:relative;padding:24px;min-height:180px";
  const fab = document.createElement("button");
  fab.textContent = "FAB";
  box.append(fab);
  body.append(box);
  createFabMenu({ opener: fab, placement, items: longList ? items : items.slice(0, 4) });
};

const variants = section(main, "Variants & sizes");
scenario(variants, {
  title: "Every placement",
  lookFor: "the menu opens on the FAB's placement side, inside the window",
  expected: "no placement crosses the viewport edge",
  mount: (body) => { for (const p of placements) mount(body, p, false); },
});

const states = section(main, "States");
scenario(states, {
  title: "Hover, focus, disabled items",
  lookFor: "state layers on items; a disabled item does not react",
  expected: "the disabled item keeps its opacity and skips focus",
  mount: (body) => { mount(body, "top-end", false); },
});

const interaction = section(main, "Interaction");
scenario(interaction, {
  title: "Long list: fit then shift",
  lookFor: "the menu fits the window; when it cannot, it shifts just enough",
  expected: "the shift readout shows the correction the list consumed",
  measure: () => {
    const list = document.querySelector(".mtrl-fab-menu__list");
    if (!list) return "open a long-list menu to measure";
    const r = list.getBoundingClientRect();
    return `list ${r.width.toFixed(0)}x${r.height.toFixed(0)} at ${r.left.toFixed(0)},${r.top.toFixed(0)} · shift var ${getComputedStyle(list).translate}`;
  },
  mount: (body) => { mount(body, "top-centre", true); },
});

const edge = section(main, "Edge cases");
scenario(edge, {
  title: "RTL and dark",
  lookFor: "mirrored placement; the same fit-then-shift behaviour",
  expected: "identical corrections mirrored",
  mount: (body) => { mount(body, "top-start", true); },
});
</script>
</body>
</html>
