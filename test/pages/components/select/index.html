<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>select</title>
<link rel="stylesheet" href="../../../../dist/styles.css">
<link rel="stylesheet" href="../../shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "../../shared/harness.js";
import { createSelect } from "../../../../dist/components/select/index.js";
await initPage({ name: "select" });
const main = document.getElementById("tp-main");

const options = [
  { id: "us", text: "United States" },
  { id: "ca", text: "Canada" },
  { id: "mx", text: "Mexico" },
];

const token = (role) => {
  const probe = document.createElement("span");
  probe.style.color = `var(--mtrl-sys-color-${role})`;
  document.body.append(probe);
  const color = getComputedStyle(probe).color;
  probe.remove();
  return color;
};

const degrees = (transform) => {
  if (!transform || transform === "none") return 0;
  const match = transform.match(/matrix\(([^)]+)\)/);
  if (!match) return 0;
  const [a, b] = match[1].split(",").map((part) => Number(part));
  return Math.round(Math.atan2(b, a) * 180 / Math.PI);
};

const arrowReadout = (root) => {
  const icon = root.querySelector(".mtrl-text-field__trailing-icon");
  const svg = icon?.querySelector("svg");
  const field = root.querySelector(".mtrl-text-field__input");
  if (!icon || !svg || !field) return "no arrow";
  const arrow = getComputedStyle(icon).color;
  const open = root.classList.contains("mtrl-select--open");
  const focused = root.matches(":focus-within");
  const error = root.classList.contains("mtrl-text-field--error");
  const role = open && !focused ? "primary" : error ? "error" : "on-surface-variant";
  const expected = token(role);
  const turned = degrees(getComputedStyle(svg).transform);
  const colour = arrow === expected ? role : `expected ${role}`;
  return `${open ? "open" : "closed"} · arrow ${arrow} (${colour}) · rotation ${turned}°`;
};

const mountSelect = (body, id, config = {}) => {
  const select = createSelect({ label: "Country", options, value: "us", ...config });
  select.element.id = id;
  body.append(select.element);
};

const variants = section(main, "Variants & sizes");
scenario(variants, {
  title: "Filled field",
  lookFor: "the trailing arrow in the field",
  expected: "the arrow is part of the field",
  measure: () => {
    const root = document.getElementById("select-filled");
    return root ? arrowReadout(root) : "no select";
  },
  mount: (body) => mountSelect(body, "select-filled"),
});

const states = section(main, "States");
scenario(states, {
  title: "Focused field",
  lookFor: "the arrow's colour while the field is focused",
  expected: "the normal focused arrow uses OnSurfaceVariant",
  measure: () => {
    const root = document.getElementById("select-focus");
    return root ? arrowReadout(root) : "no select";
  },
  mount: (body) => mountSelect(body, "select-focus"),
});
scenario(states, {
  title: "Focused field with an error",
  lookFor: "focus the outlined select and read the arrow colour",
  expected: "the arrow uses Error",
  measure: () => arrowReadout(document.getElementById("select-error")),
  mount: (body) => mountSelect(body, "select-error", { variant: "outlined", error: true }),
});
scenario(states, {
  title: "Hovered outlined label",
  lookFor: "move the pointer over the field",
  expected: "the unfocused label uses OnSurfaceVariant",
  measure: () => {
    const label = document.querySelector("#select-hover .mtrl-text-field__label");
    if (!label) return "no label";
    const colour = getComputedStyle(label).color;
    return `label ${colour}${colour === token("on-surface-variant") ? " (OnSurfaceVariant)" : ""}`;
  },
  mount: (body) => mountSelect(body, "select-hover", { variant: "outlined" }),
});

const interaction = section(main, "Interaction");
scenario(interaction, {
  title: "Open rotation",
  lookFor: "open the menu with the keyboard and watch the arrow turn",
  expected: "the focused arrow keeps OnSurfaceVariant and rotates 180° when the menu opens",
  measure: () => {
    const root = document.getElementById("select-open");
    return root ? arrowReadout(root) : "no select";
  },
  mount: (body) => mountSelect(body, "select-open"),
});
scenario(interaction, {
  title: "Option height in both popup layers",
  lookFor: "open the inline select and the top-layer select one at a time",
  expected: "each open popup has 48 px options at default density",
  measure: () => ["inline", "top"].map(layer => {
    const input = document.querySelector(`#select-height-${layer} input`);
    const listbox = document.getElementById(input?.getAttribute("aria-controls") ?? "");
    const option = listbox?.querySelector('[role="option"]');
    return `${layer} ${option ? `${option.getBoundingClientRect().height} px` : "closed"}`;
  }).join(" · "),
  mount: (body) => {
    mountSelect(body, "select-height-inline", { label: "Inline popup" });
    mountSelect(body, "select-height-top", { label: "Top-layer popup", layer: "top" });
  },
});

const edge = section(main, "Edge cases");
scenario(edge, {
  title: "Closed arrow",
  lookFor: "the arrow at rest, before the menu opens",
  expected: "the resting arrow uses OnSurfaceVariant and is not rotated",
  measure: () => {
    const root = document.getElementById("select-closed");
    return root ? arrowReadout(root) : "no select";
  },
  mount: (body) => mountSelect(body, "select-closed"),
});
</script>
</body>
</html>
