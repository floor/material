<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>drawer sections</title>
<link rel="stylesheet" href="../../../../dist/styles.css">
<link rel="stylesheet" href="../../shared/harness.css">
<style>
  /* Each drawer sits in a small app window: the navigation on the start
     side, the current page on the other, as in a real console. */
  .ds-apps { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .ds-app { margin: 0; flex: 1 1 520px; max-width: 720px; min-width: 0; }
  .ds-app figcaption { font: 500 14px/20px Roboto, system-ui, sans-serif; letter-spacing: .1px; color: var(--mtrl-sys-color-on-surface-variant); margin: 0 0 8px; }
  .ds-window {
    display: grid; grid-template-columns: 300px 1fr; height: 720px; overflow: hidden;
    border-radius: 16px; border: 1px solid var(--mtrl-sys-color-outline-variant);
    background: var(--mtrl-sys-color-surface-container-low);
  }
  .ds-nav { min-height: 0; overflow: auto; }
  .ds-nav > *, .ds-nav .mtrl-drawer { height: 100%; }
  .ds-nav .mtrl-drawer, .ds-nav .mtrl-drawer__sheet { background: transparent; border: 0; box-shadow: none; }
  .ds-page {
    margin: 12px 12px 12px 0; padding: 24px; border-radius: 16px; min-width: 0;
    background: var(--mtrl-sys-color-surface); color: var(--mtrl-sys-color-on-surface);
    display: flex; flex-direction: column; gap: 8px;
  }
  .ds-eyebrow { margin: 0; font: 500 12px/16px Roboto, system-ui, sans-serif; letter-spacing: .5px; text-transform: uppercase; color: var(--mtrl-sys-color-on-surface-variant); }
  .ds-title { margin: 0; font: 400 28px/36px Roboto, system-ui, sans-serif; }
  .ds-events { margin: 16px 0 0; padding: 0; list-style: none; font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mtrl-sys-color-on-surface-variant); }
  .ds-steps { margin: 4px 0 16px; padding-inline-start: 20px; list-style: decimal; }
  .ds-steps li { margin: 2px 0; }
  /* The comparison window puts the m3 site's child indent back on every
     section, for the owner to compare with the aligned rows. */
  .ds-indented .mtrl-drawer__group .mtrl-drawer__group-items .mtrl-drawer__item--child {
    /* !important: the aligned rule's :has() selector outweighs any page
       selector, and this window is only a comparison. */
    margin-inline-start: calc(12px + var(--mtrl-drawer-child-indent, 12px)) !important;
    width: calc(100% - 24px - var(--mtrl-drawer-child-indent, 12px)) !important;
  }
</style>
</head>

import { createDrawer } from "../../../../dist/components/drawer/index.js";

// Drawer sections, drawn the way Google's own consoles draw them (Search

// own has a label header; only its chevron, a round icon button as tall as
// the row, opens and closes it. A section with a page (Performance) is a
// destination of its own, with the chevron beside it.
let form = "factory";
const painters = new Set();
const repaint = () => { for (const paint of painters) paint(); };
const host = () => document.getElementById("tp-main");

  about: symbol("M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"), // info
};

const label = {};
const consoleItems = (active, { securityOpen = true } = {}) => [
  { id: "overview", label: "Overview", icon: icon.overview },
  { id: "insights", label: "Insights", icon: icon.insights },
  { id: "performance", label: "Performance", icon: icon.performance, selectable: true, items: [
    { id: "genai", label: "Generative AI", icon: icon.performance },
  ] },
  { id: "inspection", label: "URL inspection", icon: icon.inspection },
  { type: "divider" },
  { id: "indexing", label: "Indexing", expanded: true, items: [
    { id: "pages", label: "Pages", icon: icon.pages },
    { id: "sitemaps", label: "Sitemaps", icon: icon.sitemaps },
    { id: "removals", label: "Removals", icon: icon.removals },
  ] },
  { type: "divider" },
  { id: "experience", label: "Experience", expanded: true, items: [
    { id: "vitals", label: "Core Web Vitals", icon: icon.vitals },
    { id: "https", label: "HTTPS", icon: icon.https },
  ] },
  { type: "divider" },
  { id: "enhancements", label: "Enhancements", items: [
    { id: "breadcrumbs", label: "Breadcrumbs", icon: icon.breadcrumbs },
  ] },
  { type: "divider" },
  { id: "security", label: "Security & Manual Actions", expanded: securityOpen, items: [
    { id: "manual", label: "Manual actions", icon: icon.manual },
    { id: "issues", label: "Security issues", icon: icon.issues },
  ] },
  { type: "divider" },
  { id: "links", label: "Links", icon: icon.links },
  { id: "achievements", label: "Achievements", icon: icon.achievements },
  { id: "settings", label: "Settings", icon: icon.settings },
  { type: "divider" },
  { id: "feedback", label: "Submit feedback", icon: icon.feedback },
  { id: "about", label: "About Search Console", icon: icon.about },
].map(function mark(item) {
  if (item.id) label[item.id] = item.label;
  const next = { ...item, active: item.id === active };
  return item.items ? { ...next, items: item.items.map(mark) } : next;
});

/** The same tree as declarative <m-drawer-item> markup. */
const toElement = (items) => items.map((item) => {
  if (item.type === "divider") return '<m-drawer-item type="divider"></m-drawer-item>';
  const el = document.createElement("m-drawer-item");
  el.setAttribute("value", item.id);
  if (item.icon) el.setAttribute("icon", item.icon);
  if (item.selectable) el.setAttribute("selectable", "");
  if (item.expanded) el.setAttribute("expanded", "");
  el.append(item.label);
  if (item.items) el.insertAdjacentHTML("beforeend", toElement(item.items));
  return el.outerHTML;
}).join("");

/** One app window: the drawer and the page it shows. */
const appWindow = (caption, { active, dense = false, securityOpen = true, indented = false }) => {
  const figure = document.createElement("figure");
  figure.className = indented ? "ds-app ds-indented" : "ds-app";
  figure.innerHTML = `<figcaption>${caption}</figcaption>
    <div class="ds-window"><nav class="ds-nav" aria-label="${caption}"></nav>
    <main class="ds-page"><p class="ds-eyebrow">Current page</p><h4 class="ds-title"></h4><ul class="ds-events" aria-live="polite"></ul></main></div>`;
  const nav = figure.querySelector(".ds-nav");
  const title = figure.querySelector(".ds-title");
  const events = figure.querySelector(".ds-events");
  const log = (line) => {
    const li = document.createElement("li");
    li.textContent = line;
    events.prepend(li);
    while (events.children.length > 6) events.lastElementChild.remove();
  };
  const show = (id) => { title.textContent = label[id] ?? id; };
  const paint = () => {
    nav.replaceChildren();
    events.replaceChildren();
    const items = consoleItems(active, { securityOpen });
    show(active);
    if (form === "element") {
      const el = document.createElement("m-drawer");
      el.setAttribute("open", "");
      el.setAttribute("value", active);
      el.setAttribute("width", "300");
      if (dense) el.setAttribute("dense", "");
      el.innerHTML = toElement(items);
      el.addEventListener("select", (event) => { show(event.detail.value); log(`select ${event.detail.value}`); });
      el.addEventListener("expand", (event) => log(`expand ${event.detail.value}`));
      el.addEventListener("collapse", (event) => log(`collapse ${event.detail.value}`));
      nav.append(el);
      return;
    }
    const drawer = createDrawer({ variant: "standard", open: true, dense, width: 300, items });
    drawer.on("select", (detail) => { show(detail.id); log(`select ${detail.id}`); });
    drawer.on("expand", (detail) => log(`expand ${detail.id}`));
    drawer.on("collapse", (detail) => log(`collapse ${detail.id}`));
    nav.append(drawer.element);
  };
  painters.add(paint);
  paint();
  return { figure, nav };
};

const root = (box) => box.querySelector("m-drawer")?.shadowRoot ?? box;
const steps = (...lines) => `<ol class="ds-steps">${lines.map((line) => `<li>${line}</li>`).join("")}</ol>`;

await initPage({
  name: "drawer sections",
  toolbar: {
    density: true,
    forms: [
      { label: "Factory", render: () => { form = "factory"; repaint(); } },
      { label: "Element", render: () => { form = "element"; repaint(); } },
    ],
  },
});

// ----------------------------------------------------------------------------
const interaction = section(host(), "Interaction");

let defaultApp;
let denseApp;
scenario(interaction, {
  title: "A console navigation, default and dense",
  lookFor: steps(
    "Hover a section title (Indexing, Experience): nothing happens and the cursor stays an arrow.",
    "Hover its chevron: a round state layer as tall as the row, and the hand cursor.",
    "Click the chevron: the rows grow from the title like a menu opening, and the rows below move with them.",
    "Click Performance: it is a page of its own. Its chevron opens Generative AI without selecting anything.",
    "Tab to a chevron: the focus ring sits on the button. Enter, Space, Left and Right open and close the section.",
  ),
  expected: "Both windows behave the same. In the dense one, rows are 36 px and each chevron button is 36 px, flush with the end of the row.",
  measure: () => {
    const read = (app, name) => {
      const r = app && root(app.nav);
      const toggle = r?.querySelector('[data-id="indexing"].mtrl-drawer__item-toggle');
      const row = r?.querySelector('.mtrl-drawer__item--header[data-id="indexing"]');
      if (!toggle || !row) return `${name}: no drawer`;
      const t = toggle.getBoundingClientRect();
      const h = row.getBoundingClientRect();
      const rtl = getComputedStyle(row).direction === "rtl";
      const end = rtl ? t.left - h.left : h.right - t.right;
      return `${name}: row ${h.height.toFixed(0)} px · chevron ${t.width.toFixed(0)}×${t.height.toFixed(0)} px, ${end.toFixed(1)} px from the end`;
    };
    return `${read(defaultApp, "default")} — ${read(denseApp, "dense")}`;
  },
  mount: (body) => {
    const apps = document.createElement("div");
    apps.className = "ds-apps";
    defaultApp = appWindow("Default", { active: "breadcrumbs" });
    denseApp = appWindow("Dense", { active: "breadcrumbs", dense: true });
    apps.append(defaultApp.figure, denseApp.figure);
    body.append(apps);
  },
});

// ----------------------------------------------------------------------------
const variants = section(host(), "Variants");

scenario(variants, {
  title: "Rows under a section title: aligned or indented",
  lookFor: steps(
    "Left: rows under a title without an icon (Pages under Indexing) line up with the top-level rows, as in Search Console.",
    "Right: the same rows step in 12 px, as the drawer on m3.material.io does.",
    "In both, Generative AI under Performance (a title with an icon) keeps the indent.",
  ),
  expected: "Pick the one that reads better: the left is the experiment's default.",
  mount: (body) => {
    const apps = document.createElement("div");
    apps.className = "ds-apps";
    apps.append(
      appWindow("Aligned (Search Console)", { active: "sitemaps" }).figure,
      appWindow("Indented (m3.material.io)", { active: "sitemaps", indented: true }).figure,
    );
    body.append(apps);
  },
});

// ----------------------------------------------------------------------------
const states = section(host(), "States");

let collapsedApp;
scenario(states, {
  title: "A collapsed section that holds the current page",
  lookFor: steps(
    "Security &amp; Manual Actions starts collapsed, and its child Manual actions is the current page.",
    "Hover its chevron, then open the section, then close it again.",
  ),
  expected: "Collapsed, the whole title row carries the selected pill, and the chevron's hover circle shows darker on the pill. Open, the pill moves to Manual actions and the title is plain again.",
  measure: () => {
    const r = collapsedApp && root(collapsedApp.nav);
    const header = r?.querySelector('.mtrl-drawer__item--header[data-id="security"]');
    const pill = header?.querySelector(".mtrl-drawer__active-indicator");
    if (!pill) return "no drawer";
    return `title pill opacity ${getComputedStyle(pill, "::before").opacity} · section ${header.classList.contains("mtrl-drawer__item--expanded") ? "open" : "collapsed"}`;
  },
  mount: (body) => {
    collapsedApp = appWindow("Collapsed section", { active: "manual", securityOpen: false });
    body.append(collapsedApp.figure);
  },
});
</script>
</body>
</html>
