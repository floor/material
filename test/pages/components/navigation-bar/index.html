<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>Navigation bar</title>
<link rel="stylesheet" href="../../../../dist/styles.css">
<link rel="stylesheet" href="../../shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "../../shared/harness.js";
import { createNavigationBar } from "../../../../dist/components/navigation-bar/index.js";

const main = await initPage({ name: "navigation-bar" });
const icon = '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>';
let bar;

scenario(section(main, "States"), {
  title: "Selected horizontal destination",
  lookFor: "Select another destination and switch between light and dark.",
  expected: "The selected label and icon share OnSecondaryContainer inside the pill.",
  measure: () => {
    const selected = bar.element.querySelector("[aria-current]");
    const color = (part) => getComputedStyle(selected.querySelector(`.mtrl-navigation-bar__${part}`)).color;
    return `Label ${color("label")} · Icon ${color("icon")}`;
  },
  mount: (body) => {
    bar = createNavigationBar({
      itemLayout: "horizontal",
      items: [
        { id: "home", label: "Home", icon, active: true },
        { id: "saved", label: "Saved", icon },
      ],
    });
    body.append(bar.element);
  },
});
</script>
</body>
</html>
