<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>carousel</title>
<link rel="stylesheet" href="/dist/styles.css">
<link rel="stylesheet" href="/shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "/shared/harness.js";
import { createCarousel } from "/dist/components/carousel/index.js";
await initPage({ name: "carousel" });
const main = document.getElementById("tp-main");

const mount = (body, size = { width: 640, height: 300 }) => {
  const box = document.createElement("div");
  box.style.cssText = `width:${size.width}px;height:${size.height}px`;
  body.append(box);
  const items = Array.from({ length: 6 }, (_, i) => ({
    content: `Slide ${i + 1}`,
    image: `data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='640' height='300'><rect width='640' height='300' fill='hsl(${i * 55} 45% 55%)'/></svg>`)}`,
  }));
  const carousel = createCarousel({ items });
  box.append(carousel.element);
  return carousel;
};

const variants = section(main, "Variants & sizes");
scenario(variants, {
  title: "Standard carousel",
  lookFor: "large and compacted slides on their keylines; the title over the image",
  expected: "snap points settle on a slide",
  mount: (body) => { mount(body); },
});

const states = section(main, "States");
scenario(states, {
  title: "Hover, focus",
  lookFor: "the grab cursor; the focused slide's outline follows its keyline",
  expected: "no clipped outline",
  mount: (body) => { mount(body, { width: 480, height: 240 }); },
});

const interaction = section(main, "Interaction");
scenario(interaction, {
  title: "Drag, flick, trackpad overscroll",
  lookFor: "the slide follows the pointer; a flick advances in the reading direction; the Mac trackpad's elastic pull does not displace the strip",
  expected: "the release settles on the nearest anchor; no rubber band",
  measure: () => {
    const scroller = document.querySelector(".mtrl-carousel__scroller");
    if (!scroller) return "no scroller mounted";
    return `scrollLeft ${scroller.scrollLeft.toFixed(0)} of ${scroller.scrollWidth - scroller.clientWidth}`;
  },
  mount: (body) => { mount(body, { width: 720, height: 320 }); },
});

const edge = section(main, "Edge cases");
scenario(edge, {
  title: "RTL and dark",
  lookFor: "the reading direction flips; flicks advance leftward",
  expected: "the same settle behaviour mirrored",
  mount: (body) => { mount(body); },
});
</script>
</body>
</html>
