<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>split-button</title>
<link rel="stylesheet" href="../../../../dist/styles.css">
<link rel="stylesheet" href="../../shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "../../shared/harness.js";
import { createSplitButton } from "../../../../dist/components/split-button/index.js";
await initPage({ name: "split-button" });
const main = document.getElementById("tp-main");

const sizes = ["xs", "s", "m", "l", "xl"];
/** The interaction scenario's own row: the readout measures those buttons. */
let interactionRow = null;
const build = (size, dir) => {
  const split = createSplitButton({
    text: "Save",
    size,
    trailingLabel: "More",
    items: [
      { id: "save-as", text: "Save as…" },
      { id: "rename", text: "Rename" },
      { id: "duplicate", text: "Duplicate" },
    ],
  });
  split.element.dataset.size = size;
  split.element.dataset.dir = dir;
  return split.element;
};
const mountRow = (body, dir) => {
  const row = document.createElement("div");
  row.className = "tp-row";
  row.dir = dir;
  for (const size of sizes) row.append(build(size, dir));
  body.append(row);
  return row;
};

const variants = section(main, "Variants & sizes");
scenario(variants, {
  title: "Sizes, both directions",
  lookFor: "every size in LTR and RTL, the two halves as one pill",
  expected: "the pair reads as one control; the chevron sits in the trailing half",
  mount: (body) => { mountRow(body, "ltr"); mountRow(body, "rtl"); },
});

const densitySamples = [];
scenario(variants, {
  title: "Medium split button at four densities",
  lookFor: "both halves shrink together as the density increases",
  expected: "the visible height is 56, 52, 48 and 44 px at densities 0, −1, −2 and −3",
  mount: (body) => {
    const row = Object.assign(document.createElement("div"), { className: "tp-row" });
    for (const density of [0, -1, -2, -3]) {
      const split = build("m", "ltr");
      split.style.setProperty("--mtrl-density", String(density));
      densitySamples.push({ density, split });
      row.append(split);
    }
    body.append(row);
  },
  measure: () => densitySamples.map(({ density, split }) =>
    `density ${density} = ${split.getBoundingClientRect().height} px`).join(" · "),
});

const states = section(main, "States");
scenario(states, {
  title: "Hover, focus, pressed, disabled",
  lookFor: "the inner corner grows on hover; the state layers do not leak across the gap",
  expected: "the halves stay flat; no shadow floats over the neighbour",
  mount: (body) => { mountRow(body, "ltr"); },
});

const interaction = section(main, "Interaction");
scenario(interaction, {
  title: "Open and close both halves",
  lookFor: "the menu opens; the trailing button's corner rounds off; the chevron turns",
  expected: "the chevron turns about its centre of mass — the painted mass stays put",
  measure: () => {
    // The painted centre is the glyph polygon's centroid, not its bounding-box
    // centre: the box centre reads a real 0.275 px shift as zero (the same
    // method as scripts/check-split-button-chevron.ts).
    const centroidOf = (path) => {
      const d = path.getAttribute("d") ?? "";
      const vertices = [];
      let x = 0;
      let y = 0;
      for (const match of d.matchAll(/([MmLlHhVvZz])([^MmLlHhVvZz]*)/g)) {
        const op = match[1];
        if (op.toLowerCase() === "z") continue;
        const relative = op === op.toLowerCase();
        const nums = [...match[2].matchAll(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi)].map((n) => Number(n[0]));
        for (let i = 0; i + 1 < nums.length; i += 2) {
          x = relative ? x + nums[i] : nums[i];
          y = relative ? y + nums[i + 1] : nums[i + 1];
          vertices.push([x, y]);
        }
      }
      const first = vertices[0];
      const last = vertices[vertices.length - 1];
      if (first && last && first[0] === last[0] && first[1] === last[1]) vertices.pop();
      let twice = 0;
      let cx = 0;
      let cy = 0;
      for (let i = 0; i < vertices.length; i++) {
        const [x1, y1] = vertices[i];
        const [x2, y2] = vertices[(i + 1) % vertices.length];
        const cross = x1 * y2 - x2 * y1;
        twice += cross;
        cx += (x1 + x2) * cross;
        cy += (y1 + y2) * cross;
      }
      const point = path.ownerSVGElement.createSVGPoint();
      point.x = cx / (3 * twice);
      point.y = cy / (3 * twice);
      return point.matrixTransform(path.getScreenCTM());
    };
    const out = [];
    for (const root of (interactionRow?.querySelectorAll(".mtrl-split-button") ?? [])) {
      const button = root.querySelector(".mtrl-split-button__trailing");
      const svg = root.querySelector(".mtrl-split-button__chevron");
      const path = svg?.querySelector("path");
      if (!button || !path) continue;
      const bb = button.getBoundingClientRect();
      const ink = centroidOf(path);
      out.push(`${root.dataset.size}/${root.dataset.dir}: ink dx ${(ink.x - (bb.x + bb.width / 2)).toFixed(2)} dy ${(ink.y - (bb.y + bb.height / 2)).toFixed(2)}`);
    }
    return out.join(" · ") || "no split buttons mounted yet";
  },
  mount: (body) => { interactionRow = mountRow(body, "ltr"); },
});

const hitSamples = [];
scenario(interaction, {
  title: "Small split button hit targets",
  lookFor: "click just above or below either half of the extra-small or small button",
  expected: "both halves accept hits 23 px above and below their centres",
  mount: (body) => {
    const row = Object.assign(document.createElement("div"), { className: "tp-row" });
    for (const size of ["xs", "s"]) {
      const split = build(size, "ltr");
      row.append(split);
      for (const half of ["leading", "trailing"]) {
        hitSamples.push({ size, half, button: split.querySelector(`.mtrl-split-button__${half}`) });
      }
    }
    body.append(row);
  },
  measure: () => hitSamples.map(({ size, half, button }) => {
    const { x, y, width, height } = button.getBoundingClientRect();
    const centre = y + height / 2;
    if (centre < 23 || centre + 23 >= innerHeight) return `${size} ${half} (scroll into view)`;
    const hits = [-23, 23].map(delta => button.contains(document.elementFromPoint(x + width / 2, centre + delta)));
    return `${size} ${half} ${hits[0] ? "✓" : "×"} above, ${hits[1] ? "✓" : "×"} below`;
  }).join(" · "),
});

const edge = section(main, "Edge cases");
scenario(edge, {
  title: "RTL and dark",
  lookFor: "mirrored corners; the chevron stays centred",
  expected: "identical centre offsets in RTL",
  mount: (body) => { mountRow(body, "rtl"); },
});
</script>
</body>
</html>
