<!doctype html>
<html lang="en" data-theme="baseline">
<head>
<meta charset="utf-8">
<title>progress</title>
<link rel="stylesheet" href="../../../../dist/styles.css">
<link rel="stylesheet" href="../../shared/harness.css">
</head>
<body>
<script type="module">
import { initPage, section, scenario } from "../../shared/harness.js";
import { createProgress } from "../../../../dist/components/progress/index.js";
await initPage({ name: "progress" });
const main = document.getElementById("tp-main");

const variants = section(main, "Variants & sizes");
scenario(variants, {
  title: "Determinate and indeterminate",
  lookFor: "the determinate bar at several values; the indeterminate sweep",
  expected: "the bar and track align on the same baseline",
  mount: (body) => {
    for (const value of [0.25, 0.5, 0.75]) {
      const p = createProgress({ value });
      body.append(p.element);
    }
    const indeterminate = createProgress({});
    body.append(indeterminate.element);
  },
});

const states = section(main, "States");
scenario(states, {
  title: "Buffer candidates A–G",
  lookFor: "the buffer's colour against the track in each candidate",
  expected: "the buffer reads against the track without vanishing",
  mount: (body) => {
    const candidates = [
      ["A — secondary, solid", "secondary"],
      ["B — tertiary, solid", "tertiary"],
      ["C — outline, solid", "outline"],
      ["D — primary at 24% over the track", "primary-alpha-24"],
      ["E — primary at 38% over the track", "primary-alpha-38"],
      ["F — on-surface at 22% over the track — the default", "on-surface-alpha-22"],
      ["G — on-surface at 24% over the track", "on-surface-alpha-24"],
    ];
    for (const [label, kind] of candidates) {
      const row = document.createElement("div");
      row.style.margin = "12px 0";
      const p = createProgress({ value: 0.4, buffer: 0.7 });
      row.innerHTML = `<p style="margin:4px 0;font-size:13px">${label}</p>`;
      row.append(p.element);
      body.append(row);
    }
  },
});

const interaction = section(main, "Interaction");
scenario(interaction, {
  title: "Value scrubbing",
  lookFor: "the bar follows the value live",
  expected: "no jump or flicker between frames",
  mount: (body) => {
    const slider = document.createElement("input");
    slider.type = "range"; slider.min = "0"; slider.max = "100"; slider.value = "40";
    const p = createProgress({ value: 0.4 });
    slider.addEventListener("input", () => p.setValue(Number(slider.value) / 100));
    body.append(slider, p.element);
  },
});

const edge = section(main, "Edge cases");
scenario(edge, {
  title: "Light and dark",
  lookFor: "the track and buffer remain distinguishable in dark mode",
  expected: "no banding against the container",
  mount: (body) => {
    const p = createProgress({ value: 0.4, buffer: 0.7 });
    body.append(p.element);
  },
});
</script>
</body>
</html>
